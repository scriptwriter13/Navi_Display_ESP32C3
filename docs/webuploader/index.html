<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Firmware Flasher</title>
    
    <!-- Das ESP Web Tools Modul von unpkg -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        p { color: #666; margin-bottom: 30px; }
        
        /* Design für den Button */
        esp-web-install-button {
            display: block;
            margin-top: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Firmware Installation</h1>
        <p>Verbinde dein ESP32-Board per USB mit dem PC und klicke auf den Button, um den Flash-Vorgang zu starten.</p>

        <!-- Hier wird das Manifest eingebunden -->
        <esp-web-install-button manifest="./manifest.json">
            <button slot="activate">Firmware installieren</button>
        </esp-web-install-button>
    </div>

</body>
</html>
