<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Navi Display Installer</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h1>Navi Display Firmware Installer</h1>

        <!-- Variante 1: Zeigt auf den Display-Ordner -->
        <div style="margin: 20px;">
            <h3>Display ESP32-2424S012</h3>
            <img src="./ESP32-2424S012/ESP32-2424S012_960x960.jpg" alt="ESP32-2424S012" style="max-width: 300px; display: block; margin: 10px auto; border-radius: 8px;">
            <esp-web-install-button manifest="./ESP32-2424S012/manifest.json">
                <button slot="activate" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px;">
                    Display-Version installieren
                </button>
            </esp-web-install-button>
        </div>

        <hr style="width: 40%; margin: 30px auto;">

        <!-- Variante 2: Zeigt auf den Standard-Ordner -->
        <div style="margin: 20px;">
            <h3>Variante B: Standard Board (Ohne Display)</h3>
            <!-- Passe den Pfad für das Standard-Board-Bild hier an -->
            <img src="./standard/standard_board.jpg" alt="Standard Board" style="max-width: 300px; display: block; margin: 10px auto; border-radius: 8px;">
            <esp-web-install-button manifest="./standard/manifest.json">
                <button slot="activate" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px;">
                    Standard-Version installieren
                </button>
            </esp-web-install-button>
        </div>
    </div>
</body>
</html>
