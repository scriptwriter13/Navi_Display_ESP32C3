<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Navi Display Installer</title>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
    <div style="text-align: left; margin: 20px;">
        <a href="../index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">← Zurück zum Dashboard</a>
    </div>

    <div style="text-align: center; margin-top: 50px;">
        <h1>Navi Display Firmware Installer</h1>

        <!-- Variante 1: Display ESP32-2424S012 -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin: 40px auto; max-width: 600px; text-align: left;">
            <img src="./ESP32-2424S012/ESP32-2424S012_960x960.jpg" alt="ESP32-2424S012" style="max-width: 200px; border-radius: 8px;">
            <div>
                <h3>Display ESP32-2424S012</h3>
                <esp-web-install-button manifest="./ESP32-2424S012/manifest.json">
                    <button slot="activate" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        Display-Version installieren
                    </button>
                </esp-web-install-button>
            </div>
        </div>

        <hr style="width: 40%; margin: 30px auto;">

        <!-- Variante 2: Standard Board -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin: 40px auto; max-width: 600px; text-align: left;">
            <img src="./standard/standard_board.jpg" alt="Standard Board" style="max-width: 200px; border-radius: 8px;">
            <div>
                <h3>Variante B: Standard Board</h3>
                <esp-web-install-button manifest="./standard/manifest.json">
                    <button slot="activate" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
                        Standard-Version installieren
                    </button>
                </esp-web-install-button>
            </div>
        </div>
    </div>
</body>
</html>
