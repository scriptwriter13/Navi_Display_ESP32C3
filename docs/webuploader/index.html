<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Uploader | BikeNav_C3</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>
<body>
    <header>
        <a href="../index.html" style="text-decoration: none; color: var(--text-dim); display: block; margin-bottom: 10px;">← Zurück zum Dashboard</a>
        <h1>Web-Uploader</h1>
        <p>Firmware direkt im Browser flashen.</p>
    </header>

    <main>
        <section>
            <h2>Firmware-Auswahl</h2>
            
            <!-- Variante 1: Display ESP32-2424S012 -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin: 40px auto; max-width: 600px; text-align: left;">
                <img src="./ESP32-2424S012/ESP32-2424S012_960x960.jpg" alt="ESP32-2424S012" style="max-width: 200px; border-radius: 8px;">
                <div>
                    <h3>Display ESP32-2424S012</h3>
                    <esp-web-install-button manifest="./ESP32-2424S012/manifest.json">
                        <button slot="activate" class="btn">Display-Version installieren</button>
                    </esp-web-install-button>
                </div>
            </div>

            <hr style="width: 40%; margin: 30px auto; border: 0; border-top: 1px solid #333;">

            <!-- Variante 2: Standard Board -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin: 40px auto; max-width: 600px; text-align: left;">
                <img src="./standard/standard_board.jpg" alt="Standard Board" style="max-width: 200px; border-radius: 8px;">
                <div>
                    <h3>Variante B: Standard Board</h3>
                    <esp-web-install-button manifest="./standard/manifest.json">
                        <button slot="activate" class="btn">Standard-Version installieren</button>
                    </esp-web-install-button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 scriptwriter13 | Lizenziert unter GPLv3</p>
    </footer>
</body>
</html>
